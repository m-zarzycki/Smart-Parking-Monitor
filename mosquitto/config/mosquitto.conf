# Mosquitto 2.x – broker trybu lokalnego (odpowiednik Azure IoT Hub z diagramu 2_Architektura).
# Uwaga: Mosquitto nie obsługuje komentarzy w tej samej linii co ustawienie.

listener 1883

# Tylko zalogowani klienci; hasła w pliku passwd tworzonym poleceniem mosquitto_passwd
# (plik jest poza repozytorium). ACL określa, kto może pisać, a kto czytać tematy parking/...
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Trwała sesja odbiornika (QoS 1) przetrwa restart brokera
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# --- TLS (opcjonalnie, port 8883) ---------------------------------------------------------
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# tls_version tlsv1.2
