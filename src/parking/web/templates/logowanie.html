{% extends "base.html" %}
{% block title %}Logowanie zarządcy{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Logowanie zarządcy</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Login <input name="login" autocomplete="username" required maxlength="64"></label>
    <label>Hasło <input name="haslo" type="password" autocomplete="current-password" required></label>
    <button type="submit">Zaloguj</button>
  </form>
  <p class="hint">Konto zakłada się poleceniem <code>python -m parking uzytkownik &lt;login&gt;</code>. Hasło nie jest zapisane w żadnym pliku projektu.</p>
</section>
{% endblock %}
